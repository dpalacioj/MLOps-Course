# =============================================================================
# pyproject.toml — starter template del proyecto final
# =============================================================================
# TODO(estudiante) 01: renombra `miproyecto` en TODO este archivo (name, packages,
# scripts, mypy.files, coverage.source) y renombra la carpeta src/miproyecto/.
# Ver el README, seccion "Renombrar el paquete".
#
# Regla de dependencias: agrega SOLO lo que uses. Un pyproject con 60 paquetes
# "por si acaso" hace que `uv sync` tarde minutos, que la imagen pese 2 GB y que
# nadie sepa que necesita el proyecto de verdad.
# =============================================================================

[project]
name = "miproyecto"
version = "0.1.0"
description = "TODO(estudiante) 21: una linea que diga que problema resuelve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Datos y ML ---
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    # --- Contrato de datos ---
    "pandera>=0.22",
    # --- Tracking y registry ---
    "mlflow>=3.0",
    # --- Serving ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    # --- Monitoreo ---
    "evidently>=0.7",
    "prometheus-client>=0.21",
    # --- Utilidades ---
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Aparte porque no todo el proyecto lo necesita y engorda la imagen de serving.
orquestacion = ["prefect>=3.4"]
hpo = ["optuna>=4.0"]
notebooks = ["ipykernel>=6.29", "matplotlib>=3.8", "nbformat>=5.10"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
    "httpx>=0.27",          # lo necesita fastapi.testclient
    "types-requests>=2.32",
]

[project.scripts]
miproyecto-drift = "miproyecto.monitoring.check_drift:main"
miproyecto-promote = "miproyecto.models.promote:main"

# =============================================================================
# Empaquetado
# =============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miproyecto"]

# =============================================================================
# Ruff — lint + formato (reemplaza flake8, isort y black)
# NO agregues Black a este proyecto: la documentacion de Ruff advierte
# explicitamente contra alternar dos formatters en el mismo repositorio.
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # reglas propias de ruff
]
ignore = [
    "E501", # el formatter ya controla el largo de linea
    "B008", # Depends() de FastAPI en defaults es idiomatico
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
python_version = "3.11"
files = ["src/miproyecto"]
ignore_missing_imports = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: requiere descargar datos o levantar servicios",
    "integration: requiere MLflow o Prefect corriendo",
]

[tool.coverage.run]
source = ["src/miproyecto"]
