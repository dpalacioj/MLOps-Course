# Gateway de LLM con LiteLLM Proxy — un endpoint compatible con OpenAI.
#
# Se levanta con:
#     litellm --config sesiones/s08-llmops/gateway/config.yaml --port 4000
#
# Y la app no cambia una linea de codigo:
#     export LLMOPS_BASE_URL=http://127.0.0.1:4000
#     export LLMOPS_PROVEEDOR=openai
#
# Eso es todo el punto: la app habla el protocolo de OpenAI contra el gateway, y
# el gateway decide a que proveedor real va cada request. Ver gateway/README.md
# para qué problema resuelve y cuándo NO vale la pena.
#
# NINGUNA CLAVE VA EN ESTE ARCHIVO. Todas se leen del entorno con la sintaxis
# os.environ/NOMBRE. El archivo se commitea; el .env no (ver .gitignore).

model_list:
  # ---------------------------------------------------------------------------
  # Nombres logicos, no nombres de modelo. La app pide "clasificador-rapido" y
  # el gateway decide cual es hoy. Cambiar de modelo pasa a ser un cambio de
  # configuracion del gateway en lugar de un deploy de la aplicacion.
  #
  # Es exactamente el mismo desacoplamiento que da 'models:/nombre@champion' en
  # el Model Registry: un alias mutable delante de un artefacto concreto.
  # ---------------------------------------------------------------------------
  - model_name: clasificador-rapido
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500
      timeout: 30

  - model_name: clasificador-rapido       # mismo nombre logico = destino de fallback
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 500
      timeout: 30

  - model_name: juez
    litellm_params:
      # El juez es a proposito de OTRO proveedor que el clasificador: un modelo
      # evaluando su propia salida tiende a aprobarla (sesgo de auto-preferencia).
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60

router_settings:
  # Round robin entre los dos destinos de 'clasificador-rapido'.
  routing_strategy: simple-shuffle

  # Fallback entre modelos. Cuando el primario devuelve 429 o 5xx, el request va
  # al siguiente en lugar de fallar.
  #
  # Advertencia que hay que decir en clase: un fallback silencioso a otro modelo
  # cambia la distribucion de las salidas sin que nadie se entere. El eval se
  # corrio contra gpt-4o-mini y en produccion respondio claude-haiku. Por eso el
  # nombre del modelo que REALMENTE respondio se guarda en la traza y en el
  # resultado (ver RespuestaLLM.modelo): sin eso, el fallback convierte un
  # incidente de disponibilidad en una regresion de calidad inexplicable.
  fallbacks:
    - clasificador-rapido: ["juez"]

  # Reintentos ante error transitorio. Acotados: un reintento sin tope contra un
  # proveedor caido multiplica la factura sin resolver nada.
  num_retries: 2
  request_timeout: 60

  # Cache de respuestas identicas. Con temperatura 0 y prompts repetidos —el caso
  # de un eval que se corre en cada PR— el ahorro es grande.
  #
  # Y el riesgo tambien: una respuesta cacheada hace que el eval mida la cache y
  # no el modelo. Regla: cache ON en produccion, cache OFF cuando se corre un eval.
  cache: false

litellm_settings:
  drop_params: true          # ignora params que el proveedor destino no soporta
  set_verbose: false         # nunca true en produccion: loguea prompts completos

  # Logging central. Es la razon principal para tener un gateway: un solo lugar
  # donde ver quien llamo, a que modelo, cuantos tokens y cuanto costo, sin
  # instrumentar cada servicio por separado.
  success_callback: ["mlflow"]
  failure_callback: ["mlflow"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL     # requerido para budgets y virtual keys

  # -------------------------------------------------------------------------
  # Budgets. Esta es la diferencia practica entre "tenemos un LLM en produccion"
  # y "tenemos un LLM en produccion y sabemos cuanto va a costar el mes".
  #
  # Sin un tope, el costo de un bug es ilimitado: un bucle de reintentos, un
  # prompt que crecio, un script de un estudiante en un for sin sleep. Con tope,
  # el peor caso es conocido de antemano.
  # -------------------------------------------------------------------------
  max_budget: 50            # USD, total del despliegue
  budget_duration: 30d

  # Alertas antes de llegar al tope. Un budget que solo avisa cuando ya corto el
  # servicio no es un control de costos: es un incidente programado.
  alerting: ["slack"]
  alerting_threshold: 0.8   # avisa al 80% del presupuesto

# =============================================================================
# Claves virtuales por usuario o equipo
# =============================================================================
# NO se declaran aqui: se crean por API contra el gateway ya levantado, porque
# cada una devuelve un secreto que no debe estar en un archivo commiteado.
#
#   curl -X POST http://127.0.0.1:4000/key/generate \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
#     -H "Content-Type: application/json" \
#     -d '{
#           "models": ["clasificador-rapido"],
#           "max_budget": 5,
#           "budget_duration": "30d",
#           "rpm_limit": 60,
#           "metadata": {"equipo": "curso-mlops", "cohorte": "2026-2"}
#         }'
#
# Cada estudiante recibe su clave con su tope de 5 USD. Consecuencias practicas,
# y son la razon de hacerlo asi:
#
# 1. La clave del proveedor NUNCA sale del gateway. Nadie la ve, nadie la
#    commitea por accidente, y rotarla no obliga a avisar a 30 personas.
# 2. El costo es atribuible por persona, no un total opaco a fin de mes.
# 3. Un estudiante que deja un bucle corriendo gasta SUS 5 USD y no el
#    presupuesto del curso.
# 4. Revocar el acceso de una persona es borrar una clave, no rotar la del
#    proveedor y redeployar todo.
