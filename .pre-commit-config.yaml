# =============================================================================
# pre-commit — Curso MLOps
# =============================================================================
# Instalacion:  make setup     (o: uv run pre-commit install)
# Ejecucion:    uv run pre-commit run --all-files
#
# Regla: el CI corre lo mismo que estos hooks. Si el hook pasa en local, el CI
# pasa. Si divergen, el hook deja de servir y la gente lo desactiva con
# --no-verify.
# =============================================================================
# `default_install_hook_types` incluye pre-push porque la validacion del nombre
# de rama vive aqui desde que se elimino `.githooks/`. Ver el docstring de
# scripts/hooks/nombre_de_rama.py: git admite un solo `core.hooksPath`, y tener
# dos sistemas de hooks hacia que pre-commit se negara a instalarse.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # --- Higiene general ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|ipynb)$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # 500 KB. Los artefactos binarios commiteados (model.ubj, preprocessor.b,
        # lin_reg.bin) fueron uno de los problemas del repo: el modelo se obtiene
        # del registry, no del control de versiones.
        args: ["--maxkb=500"]
      - id: detect-private-key

  # --- Lint + formato (Ruff reemplaza flake8, isort y black) ---
  # NO agregar Black aqui. La doc de Ruff advierte explicitamente contra
  # alternar los dos formatters en el mismo repositorio.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Notebooks sin outputs ---
  # Los notebooks del repo llegaron a tener 82 KB de imagenes en base64 y rutas
  # absolutas de la autora original en los outputs. Los outputs son ruido en el
  # diff y filtran informacion del entorno de quien ejecuto.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # --- Seguridad ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  # --- Conventional Commits ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            chore,
            revert,
          ]

  # --- Verificaciones propias del curso ---
  - repo: local
    hooks:
      - id: sin-rutas-absolutas
        name: sin rutas absolutas de usuario
        description: >
          Bloquea /Users/<algo> y C:\Users\<algo>. El repo tenia la ruta del
          disco de la autora original en prefect.yaml, lo que hacia fallar
          `prefect deploy` en cualquier otra maquina.
        entry: python scripts/hooks/sin_rutas_absolutas.py
        language: system
        types_or: [python, yaml, jupyter, markdown, toml]

      - id: mlflow-sin-stages
        name: MLflow sin stages deprecados
        description: >
          Bloquea transition_model_version_stage y models:/<nombre>/Production.
          El curso ensena aliases + tags; el codigo debe ser coherente con eso.
        entry: python scripts/hooks/mlflow_sin_stages.py
        language: system
        types_or: [python, jupyter]
        # Excluidos, y cada uno por una razon distinta:
        # - s03-tracking/{notebooks,scenarios}: ahi la API vieja aparece como
        #   contraejemplo marcado y desactivado, que es material de clase.
        # - scripts/hooks/: es el propio hook, que contiene los patrones.
        # - tests/: los tests que verifican que estas APIs NO se usan tienen que
        #   nombrarlas para poder buscarlas. Excluirlos no abre un hueco: si
        #   alguien mete un stage en src/, el hook lo atrapa igual.
        # - _generar_notebooks.py: genera celdas que discuten la API deprecada.
        exclude: |
          (?x)^(
            sesiones/s03-tracking/(notebooks|scenarios)/
            |scripts/hooks/
            |tests/
            |sesiones/.*/_generar_notebooks\.py$
          )

      - id: mypy-src
        name: mypy sobre src/taxi y scripts
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src/taxi|scripts)/.*\.py$

      - id: nombre-de-rama
        name: convencion de nombre de rama
        description: >
          Valida <tipo>/<descripcion-en-kebab-case> antes de un push. Sustituye
          a .githooks/pre-push, que quedaba inutilizado junto con el resto de
          pre-commit por el conflicto de core.hooksPath.
        entry: python scripts/hooks/nombre_de_rama.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
