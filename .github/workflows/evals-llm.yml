name: Evals LLM (S08)

# Por que un workflow aparte del CI
# ---------------------------------
# Los evals de LLM tienen dos propiedades que el resto del CI no tiene: pueden
# costar dinero y pueden necesitar un secreto. Mezclarlos con `ci.yml` obligaria a
# decidir entre dos malas opciones: correrlos en cada push (y pagar) o
# desactivarlos (y no tener gate).
#
# Aqui se separan y se resuelve asi: los scorers deterministas contra el
# ProveedorFake corren SIEMPRE y son el gate; el eval con modelo real corre solo
# cuando hay OPENAI_API_KEY configurada, que en un fork NO es el caso.
#
# La regla de fondo es la misma que en `ci.yml`: un pipeline que no puede fallar es
# peor que no tener pipeline. Este puede fallar, y falla por el motivo correcto.

on:
  push:
    branches: [main]
    paths:
      - "sesiones/s08-llmops/**"
      - ".github/workflows/evals-llm.yml"
  pull_request:
    # Se dispara cuando cambia un PROMPT, el codigo de la sesion, el dataset de
    # evals o la rubrica del juez. Cambiar un prompt es un cambio de
    # comportamiento del sistema y debe pasar por el gate igual que un cambio de
    # codigo: es literalmente el punto de la sesion.
    paths:
      - "sesiones/s08-llmops/**"
      - ".github/workflows/evals-llm.yml"
  workflow_dispatch:
    inputs:
      con_modelo_real:
        description: "Correr tambien el eval contra el modelo real (consume cuota)"
        type: boolean
        default: false

concurrency:
  group: evals-llm-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # El paquete de la sesion 8 vive fuera de src/: no esta en el pythonpath del
  # pyproject a proposito, para no obligar a instalar el extra llmops.
  PYTHONPATH: sesiones/s08-llmops/src
  # Sin esto, @mlflow.trace intenta exportar al tracking server y se cuelga en el
  # reintento con backoff. Medido en este repo: mas de 2 minutos sin retornar.
  # La observabilidad no puede ser un punto de fallo de lo observado.
  LLMOPS_TRACING: "off"

jobs:
  # ===========================================================================
  # Gate: corre siempre, sin secretos, sin red.
  # ===========================================================================
  evals-deterministas:
    name: Evals deterministas (ProveedorFake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias
        # Sin --extra llmops a proposito. Si la suite de la sesion 8 no pasa sin
        # openai instalado, el extra opcional no es opcional y hay que arreglarlo.
        run: uv sync --group dev --locked

      - name: Verificar que openai NO esta instalado
        # Test del test: garantiza que el resto del job realmente corre en el
        # escenario degradado. Si algun dia una dependencia arrastra openai, este
        # paso avisa antes de que el import tardio deje de estar ejercitado.
        run: |
          if uv run python -c "import openai" 2>/dev/null; then
            echo "::warning::openai esta instalado; el escenario 'sin extra llmops' ya no se prueba aqui"
          else
            echo "OK: openai no esta instalado, se prueba el camino degradado"
          fi

      - name: Tests de la sesion 8
        run: uv run pytest sesiones/s08-llmops/tests -v

      - name: Validar el dataset de evals
        # El dataset es el activo que sostiene todas las metricas. Un JSONL con
        # una etiqueta fuera del enum no lanza ninguna excepcion: produce
        # metricas plausibles y equivocadas.
        run: |
          uv run python -c "
          from clasificador import datos
          casos = datos.cargar_casos()
          print(f'{len(casos)} casos validos')
          assert len(casos) >= 30, f'el dataset debe tener al menos 30 casos, tiene {len(casos)}'
          print('distribucion:', datos.distribucion_de_categorias(casos))
          "

      - name: Eval como gate (exit != 0 si baja del umbral)
        env:
          LLMOPS_PROVEEDOR: fake
        run: uv run python -m clasificador.evaluar --sin-juez --sin-mlflow

      - name: Comparacion de las dos versiones del prompt
        env:
          LLMOPS_PROVEEDOR: fake
        run: uv run python -m clasificador.comparar_prompts --sin-juez

      - name: Calibracion del juez (informativa, no bloquea)
        # No bloquea a proposito: el JuezFake tiene kappa por debajo del corte
        # porque no puede evaluar fidelidad, y eso es la LECCION, no un fallo.
        # Un gate que falla por el motivo esperado ensena al equipo a ignorarlo.
        continue-on-error: true
        run: |
          uv run python -c "
          from clasificador.scorers.juez import JuezFake, calibrar, resultado_reportable
          cal = calibrar(JuezFake())
          print(resultado_reportable(cal, 1.0))
          print()
          print('Desacuerdos con el humano:', cal.desacuerdos)
          if cal.punto_ciego:
              print('Punto ciego:', cal.punto_ciego)
          "

      - name: Publicar el reporte en el resumen del job
        if: always()
        run: |
          for f in reports/llmops/eval-*.md reports/llmops/comparacion-prompts.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" && echo "" >> "$GITHUB_STEP_SUMMARY"
          done || true

      - name: Subir los reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-evals-llm
          path: reports/llmops/
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # Eval con modelo real: se SALTA con un mensaje claro si no hay secreto.
  # ===========================================================================
  evals-modelo-real:
    name: Evals contra el modelo real
    runs-on: ubuntu-latest
    needs: [evals-deterministas]
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar si hay credenciales
        id: credenciales
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Eval con modelo real: OMITIDO"
              echo ""
              echo "No hay \`OPENAI_API_KEY\` configurada en este repositorio."
              echo "**Esto es lo normal y esperado en un fork**, y no es un error."
              echo ""
              echo "El gate de calidad ya corrio en el job anterior:"
              echo "los scorers deterministas contra \`ProveedorFake\`, sin red y sin costo."
              echo "Ese job SI bloquea el merge."
              echo ""
              echo "Para habilitar este job en tu propio fork:"
              echo ""
              echo '1. Settings -> Secrets and variables -> Actions -> New repository secret'
              echo '2. Nombre: `OPENAI_API_KEY`'
              echo '3. Usa una clave con presupuesto limitado, o mejor una clave VIRTUAL'
              echo '   del gateway de LiteLLM (ver `sesiones/s08-llmops/gateway/README.md`):'
              echo '   asi el tope de gasto lo pone el gateway y no la confianza.'
              echo ""
              echo "Costo aproximado por corrida: 36 casos x 2 versiones de prompt,"
              echo "mas el juez. Revisa \`sesiones/s08-llmops/costos.md\` para estimarlo"
              echo "con los precios vigentes antes de habilitarlo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "OMITIDO: no hay OPENAI_API_KEY. Ver el resumen del job."
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.credenciales.outputs.disponible == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias con el extra llmops
        if: steps.credenciales.outputs.disponible == 'true'
        run: uv sync --group dev --extra llmops --locked

      - name: Eval con el modelo real
        if: steps.credenciales.outputs.disponible == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Si hay un gateway, apuntar aqui: la clave del proveedor no sale de el.
          LLMOPS_BASE_URL: ${{ vars.LLMOPS_BASE_URL }}
          LLMOPS_PROVEEDOR: openai
          LLMOPS_MODELO: ${{ vars.LLMOPS_MODELO || 'gpt-4o-mini' }}
        run: |
          uv run python -m clasificador.evaluar \
            --prompt v2 \
            --juez ninguno \
            --sin-mlflow \
            --umbral-categoria 0.70

      - name: Subir los reportes
        if: always() && steps.credenciales.outputs.disponible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reportes-evals-modelo-real
          path: reports/llmops/
          if-no-files-found: warn
          retention-days: 14
